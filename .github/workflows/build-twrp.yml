name: build-twrp

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target device'
        type: choice
        default: lmi
        options: [lmi, umi, cmi, cas, apollo]
      twrp_branch:
        description: 'TWRP minimal manifest branch'
        default: 'twrp-12.1'
      device_branch:
        description: 'Device tree branch (sekaiacg/android_device_xiaomi_umi_TWRP)'
        default: 'android-13'
      decrypt_platform:
        description: 'DECRYPT_PLATFORM_VERSION（安卓平台版本：15=原来给 A15 ROM 的，17=给 A17 ROM）'
        default: '17'
      manifest_url:
        description: 'Manifest git URL (official minimal-manifest, or a fork for twrp-15/twrp-16 experiments)'
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git'
      prop_release:
        description: 'prop.default 里所有 *.build.version.release 改成这个（空=不改）'
        default: '17'
      twrp_device_version:
        description: 'TW_DEVICE_VERSION (显示成 3.7.1_12-v<这个>)'
        default: '9.0'
      skkk_ver:
        description: 'TW_SKKK_VER_CODE (optional, empty = not set)'
        default: ''
      min_free_gb:
        description: 'Abort if free disk below this many GB'
        default: '30'
      repo_url:
        description: 'git-repo source (swap to a mirror if googlesource is unreachable)'
        default: 'https://gerrit.googlesource.com/git-repo'

concurrency:
  group: build-twrp-${{ inputs.device }}-${{ inputs.twrp_branch }}
  cancel-in-progress: false

jobs:
  build:
    # AOSP 12.1 host tools break on 24.04 (gcc-13 / glibc 2.39); 20.04 is retired.
    runs-on: ubuntu-22.04
    # GitHub-hosted hard limit is 6h; -j4 on a 4 vCPU runner lands well below it.
    timeout-minutes: 350
    name: build-${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        # skkk 每个 ROM 代次发两个包：..._A15-lmi-skkk.img 与 ..._A15_FBEv2-lmi-skkk.img
        variant: [miui, aosp]

    steps:
      - name: Free disk space
        run: |
          set -x
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/lib/jvm 2>/dev/null || true
          sudo apt-get purge -y 'dotnet-*' 'mongodb-*' 'mysql-*' 'temurin-*' 'zulu-*' 2>/dev/null || true
          sudo apt-get clean
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /mnt/swapfile 2>/dev/null || true
          docker image prune -a -f 2>/dev/null || true
          df -h /

      - name: Check free disk
        env:
          MIN_GB: ${{ inputs.min_free_gb }}
        run: |
          avail=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "free: ${avail}GB, required: ${MIN_GB}GB"
          if [ "$avail" -lt "$MIN_GB" ]; then
            echo "::error::not enough disk after cleanup (${avail}GB < ${MIN_GB}GB)"
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg \
            gperf imagemagick lib32z1-dev libc6-dev-i386 libncurses5 libncurses5-dev \
            libssl-dev libxml2-utils lz4 rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev python3 python-is-python3 unzip
          # not present on 22.04 anymore / optional for older branches
          for p in lib32ncurses5-dev lib32readline-dev libsdl1.2-dev pngcrush liblz4-tool \
                   openjdk-11-jdk-headless; do
            sudo apt-get install -y --no-install-recommends "$p" || echo "skip $p"
          done
          java -version 2>&1 | head -3 || true

      - name: repo init + sync (${{ inputs.twrp_branch }})
        env:
          BRANCH: ${{ inputs.twrp_branch }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          export PATH="$HOME/bin:$PATH"
          export REPO_URL="${{ inputs.repo_url }}"

          git config --global user.name  "gha-bot"
          git config --global user.email "gha-bot@users.noreply.github.com"
          git config --global color.ui false
          git config --global http.postBuffer 524288000

          mkdir -p "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"
          repo init --depth=1 -u "${{ inputs.manifest_url }}" -b "$BRANCH"
          repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags
          du -sh .repo
          # 一次性构建用不到 repo 的元数据/git 历史，删掉给 out/ 腾 6-8 GB
          rm -rf .repo

      - name: Add device tree (${{ inputs.device_branch }})
        env:
          BRANCH: ${{ inputs.device_branch }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/twrp"
          git clone --depth=1 -b "$BRANCH" \
            https://github.com/sekaiacg/android_device_xiaomi_umi_TWRP.git device/xiaomi/umi
          # sanity: the product for the chosen device must exist
          grep -q "twrp_${{ inputs.device }}.mk" device/xiaomi/umi/AndroidProducts.mk \
            || { echo "::error::device/xiaomi/umi has no twrp_${{ inputs.device }}.mk on $BRANCH"; exit 1; }

      - name: Build recovery
        env:
          DEVICE: ${{ inputs.device }}
          DECRYPT_PLATFORM: ${{ inputs.decrypt_platform }}
          VARIANT: ${{ matrix.variant }}
          SKKK_VER: ${{ inputs.skkk_ver }}
          DEVICE_VERSION: ${{ inputs.twrp_device_version }}
          PROP_REL: ${{ inputs.prop_release }}
        run: |
          set -eo pipefail   # envsetup.sh 有未定义变量，-u 会让它在 line 877 直接退出
          cd "$GITHUB_WORKSPACE/twrp"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export TW_DEFAULT_LANGUAGE=zh_CN
          if [ -n "$DECRYPT_PLATFORM" ]; then export DECRYPT_PLATFORM_VERSION="$DECRYPT_PLATFORM"; fi
          if [ "$VARIANT" = "aosp" ]; then export TW_USE_FBEV2=true; fi   # FBEv2：AOSP/类原生 ROM 解密
          if [ -n "$SKKK_VER" ]; then export TW_SKKK_VER_CODE="$SKKK_VER"; fi
          if [ -n "$DEVICE_VERSION" ]; then export TW_DEVICE_VERSION="$DEVICE_VERSION"; fi
          unset USE_CCACHE   # ccache cannot survive between runs; it only eats disk here
          . build/envsetup.sh
          lunch "twrp_${DEVICE}-eng"
          mka recoveryimage 2>&1 | tee build.log

          # 按需求刷 prop.default 里的 *.build.version.release，然后重新打包 recovery.img
          if [ -n "$PROP_REL" ]; then
            CHANGED=0
            for f in out/target/product/*/recovery/root/prop.default out/target/product/*/root/prop.default; do
              [ -f "$f" ] || continue
              echo "== $f (before)"; grep -E '\.build\.version\.release=' "$f" || true
              sed -i -E "s/^([A-Za-z0-9_.]*\.build\.version\.release)=.*/\1=${PROP_REL}/" "$f"
              echo "== $f (after)";  grep -E '\.build\.version\.release=' "$f" || true
              CHANGED=1
            done
            if [ "$CHANGED" = "1" ]; then
              rm -f out/target/product/*/recovery.img
              mka recoveryimage 2>&1 | tee -a build.log
            else
              echo "::warning::recovery 根目录里没找到 prop.default，version.release 未改"
            fi
          fi
          df -h /

      - name: Report image
        if: always()
        run: |
          ls -l "$GITHUB_WORKSPACE"/twrp/out/target/product/*/recovery.img 2>/dev/null || true
          for f in "$GITHUB_WORKSPACE"/twrp/out/target/product/*/recovery.img; do
            [ -f "$f" ] || continue
            echo "$f: $(stat -c%s "$f") bytes"
            # BOARD_RECOVERYIMAGE_PARTITION_SIZE = 128MB, hard fail if it cannot be flashed
            if [ "$(stat -c%s "$f")" -gt 134217728 ]; then
              echo "::error::recovery.img exceeds the 128MB recovery partition"
              exit 1
            fi
          done

      - name: Upload recovery image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-${{ inputs.device }}-${{ inputs.twrp_branch }}-${{ matrix.variant }}
          path: ${{ github.workspace }}/twrp/out/target/product/*/recovery.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ inputs.device }}-${{ matrix.variant }}
          path: |
            ${{ github.workspace }}/twrp/build.log
            ${{ github.workspace }}/twrp/out/verbose.log.gz
          if-no-files-found: ignore
          retention-days: 7
